apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports:
            - {name: http, containerPort: 3000}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 256Mi}
        - name: datasource
          configMap: {name: grafana-datasource}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
  type: ClusterIP
