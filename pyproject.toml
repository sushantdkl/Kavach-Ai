[project]
name = "kavach-ai"
version = "0.1.0"
description = "Isolated synthetic payment autoscaling research testbed"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyyaml>=6,<7", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["payment-api", "."]
testpaths = ["payment-api/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
